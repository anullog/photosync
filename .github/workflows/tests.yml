name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: ShellCheck
        # pinned: a newer ShellCheck can add checks and fail an unchanged script
        run: |
          python3 -m venv "$RUNNER_TEMP/sc"
          "$RUNNER_TEMP/sc/bin/pip" install --quiet --disable-pip-version-check shellcheck-py==0.11.0.1
          "$RUNNER_TEMP/sc/bin/shellcheck" --version
          "$RUNNER_TEMP/sc/bin/shellcheck" -x --shell=bash photo.sh photo_tests.sh

  test:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PHOTO_TESTS_REQUIRE_PTY: 1   # the terminal tests must run here, not be skipped
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Built-in rsync only
        run: |
          /usr/bin/rsync --version | head -2
          PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash photo_tests.sh

      - name: Homebrew rsync 3.x and built-in rsync
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew list rsync >/dev/null 2>&1 || brew install rsync
          /bin/bash photo_tests.sh
